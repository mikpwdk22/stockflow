services:
  db:
    image: postgres:16
    container_name: stockflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: MikoSanjaya
      POSTGRES_PASSWORD: stockflowtest
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds/01_seed_data.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "MikoSanjaya", "-d", "stockflow" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockflow-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://MikoSanjaya:stockflowtest@db:5432/stockflow?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stockflow-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
