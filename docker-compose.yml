services:
  db:
    image: postgres:16
    container_name: stockflow-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ...
      POSTGRES_USER: ...
      POSTGRES_PASSWORD: ...

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "your_username", "-d", "your_database" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
